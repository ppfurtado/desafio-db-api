spring:
  config:
    activate:
      on-profile: prod

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:20}
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}

    ssl:
      key-store-location: ${KAFKA_KEYSTORE_LOCATION:classpath:client-certs/client.keystore.p12}
      key-store-password: ${KAFKA_KEYSTORE_PASSWORD:}
      key-store-type: ${KAFKA_KEYSTORE_TYPE:PKCS12}

      trust-store-location: ${KAFKA_TRUSTSTORE_LOCATION:classpath:client-certs/client.truststore.jks}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:}
      trust-store-type: ${KAFKA_TRUSTSTORE_TYPE:PKCS12}

    producer:
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 10
        batch.size: 65536
        compression.type: lz4
        max.block.ms: 1000
        buffer.memory: 67108864

    consumer:
      group-id: desafio-votacao-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

server:
  port: ${SERVER_PORT:8089}
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

app:
  session:
    default-duration-minutes: ${APP_SESSION_DURATION:60}
  cpf-validator:
    enabled: ${CPF_VALIDATOR_ENABLED:true}

logging:
  level:
    com.ppfurtado.desafiovotacao: WARN
    org.springframework.web: WARN
    org.hibernate: WARN