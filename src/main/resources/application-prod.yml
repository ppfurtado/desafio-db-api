spring:
  config:
    activate:
      on-profile: prod

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:20}
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  ssl:
    bundle:
      pem:
        aiven:
          keystore:
            certificate: file:/etc/secrets/service.cert
            private-key: file:/etc/secrets/service.key
          truststore:
            certificate: file:/etc/secrets/ca.pem

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    security:
      protocol: SSL
    ssl:
      bundle: aiven

    producer:
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 10
        batch.size: 65536
        compression.type: lz4
        max.block.ms: 1000
        buffer.memory: 67108864

    consumer:
      group-id: desafio-votacao-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.ppfurtado.desafiovotacao.*"

server:
  port: ${SERVER_PORT:${PORT:8080}}
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

app:
  session:
    default-duration-minutes: ${APP_SESSION_DURATION:60}
  cpf-validator:
    enabled: ${CPF_VALIDATOR_ENABLED:true}

logging:
  level:
    com.ppfurtado.desafiovotacao: WARN
    org.springframework.web: WARN
    org.hibernate: WARN